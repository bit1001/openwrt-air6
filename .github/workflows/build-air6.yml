name: Build OpenWrt AIR6 (MT6990)

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      debug_log:
        description: "Build with -j1 V=s for verbose logs"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync unzip zlib1g-dev file wget curl libelf-dev zstd \
            squashfs-tools swig xsltproc time

      - name: Configure pinned feeds
        run: |
          cat > feeds.conf << 'EOF'
          src-git packages https://github.com/openwrt/packages.git^aea49e65a439f73fbc0e4b8c60ced1f1839f64fd
          src-git luci https://github.com/openwrt/luci.git^e969939b49167516e219d465df8030d98d443d67
          src-git routing https://github.com/openwrt/routing.git^48c808034414a2112cf9d5261a20a320e8d0d170
          src-git telephony https://github.com/openwrt/telephony.git^c58ec5a6703966dcccb53d0919698c8aba3a9ef5
          EOF
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

      - name: Download package sources
        run: |
          make download -j8
          find dl -size -1024c -exec ls -l {} +

      - name: Build firmware
        run: |
          if [ "${{ inputs.debug_log }}" = "true" ]; then
            make -j1 V=s
          else
            make -j"$(nproc)" || make -j1 V=s
          fi

      - name: Summarize build outputs
        if: always()
        run: |
          echo "### Build Artifacts" >> "$GITHUB_STEP_SUMMARY"
          if [ -d bin/targets/mediatek/mt6990 ]; then
            ls -lh bin/targets/mediatek/mt6990/ | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No output directory bin/targets/mediatek/mt6990 found." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: openwrt-air6-mt6990-images
          path: bin/targets/mediatek/mt6990/
          retention-days: 14
