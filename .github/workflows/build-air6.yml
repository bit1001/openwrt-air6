name: Build OpenWrt AIR6 (MT6990)

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      debug_log:
        description: "Build with -j1 V=s for verbose logs"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync unzip zlib1g-dev file wget curl libelf-dev zstd \
            squashfs-tools swig xsltproc time

      - name: Configure pinned feeds
        run: |
          cat > feeds.conf << 'EOF'
          src-git packages https://github.com/openwrt/packages.git^aea49e65a439f73fbc0e4b8c60ced1f1839f64fd
          src-git luci https://github.com/openwrt/luci.git^e969939b49167516e219d465df8030d98d443d67
          src-git routing https://github.com/openwrt/routing.git^48c808034414a2112cf9d5261a20a320e8d0d170
          src-git telephony https://github.com/openwrt/telephony.git^c58ec5a6703966dcccb53d0919698c8aba3a9ef5
          EOF
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # Speed up SDK packing: upstream uses zstd --ultra -20 which can take
          # 30-60 min on the multi-GB host toolchain. Lower compression level
          # only changes archive size/speed, NOT SDK content or kernel vermagic.
          sed -i "s/zstd -T0 --ultra -20/zstd -T0 -5/" target/sdk/Makefile
          grep -n 'zstd -T0' target/sdk/Makefile
          make defconfig
          # Build the SDK from this exact tree so its toolchain, kernel headers,
          # Module.symvers and vermagic match the firmware byte-for-byte.
          echo CONFIG_SDK=y >> .config
          make defconfig
          grep -E '^CONFIG_SDK=y' .config

      - name: Download package sources
        run: |
          make download -j8
          find dl -size -1024c -exec ls -l {} +

      - name: Build firmware
        run: |
          set -o pipefail
          if [ "${{ inputs.debug_log }}" = "true" ]; then
            make -j1 V=s 2>&1 | tee build.log
          else
            make -j"$(nproc)" 2>&1 | tee build.log || make -j1 V=s 2>&1 | tee -a build.log
          fi

      - name: Summarize build outputs
        if: always()
        run: |
          echo "### Build Artifacts" >> "$GITHUB_STEP_SUMMARY"
          if [ -d bin/targets/mediatek/mt6990 ]; then
            ls -lh bin/targets/mediatek/mt6990/ | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No output directory bin/targets/mediatek/mt6990 found." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -d build-logs ]; then
            echo "### Sub-build Logs" >> "$GITHUB_STEP_SUMMARY"
            for logfile in build-logs/*.log; do
              if [ -f "$logfile" ]; then
                echo "#### $logfile" >> "$GITHUB_STEP_SUMMARY"
                echo '```text' >> "$GITHUB_STEP_SUMMARY"
                grep -i -C 2 "error:" "$logfile" | head -n 40 >> "$GITHUB_STEP_SUMMARY" || true
                tail -n 30 "$logfile" >> "$GITHUB_STEP_SUMMARY"
                echo '```' >> "$GITHUB_STEP_SUMMARY"
              fi
            done
          fi
          if [ -f build.log ] && [ "${{ job.status }}" = "failure" ]; then
            echo "### Build Error Tail" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 100 build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload build log on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: openwrt-air6-build-logs
          path: |
            build.log
            build-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: openwrt-air6-mt6990-images
          path: bin/targets/mediatek/mt6990/
          retention-days: 14

      - name: Verify and upload SDK
        if: success()
        run: |
          set -e
          SDK=$(find bin/targets/mediatek/mt6990/ -maxdepth 1 -name 'openwrt-sdk-*.tar.zst' | head -n1)
          if [ -z "$SDK" ]; then echo "ERROR: SDK tarball not found"; exit 1; fi
          echo "SDK_FILE=$SDK" >> "$GITHUB_ENV"
          echo "### SDK (same-tree, firmware-matching)" >> "$GITHUB_STEP_SUMMARY"
          ls -lh "$SDK" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "$SDK" >> sdk-path.txt

      - name: Upload SDK artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: openwrt-air6-sdk
          path: |
            bin/targets/mediatek/mt6990/openwrt-sdk-*.tar.zst
            sdk-path.txt
          if-no-files-found: error
          retention-days: 30
