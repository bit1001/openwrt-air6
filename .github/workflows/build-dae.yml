name: Build luci-app-dae with AIR6 SDK

# Builds the architecture-independent LuCI packages (luci-app-dae,
# luci-lib-daeuniverse, translations) from daeuniverse/openwrt-packages against
# the AIR6 SDK produced by build-air6.yml. Mirrors the upstream feed's own
# LuCI job: dae itself (a Go binary needing kernel BTF + kmods + Go/clang) is
# NOT built here — it is deselected on the command line, so only the pure-Lua
# LuCI apks are produced. On ImmortalWrt the kernel has its own BTF, so the
# empty vmlinux-btf-builtin package satisfies the dependency.
#
# Result: .apk files install on the flashed firmware with
#   apk add --allow-untrusted luci-app-dae-*.apk luci-lib-daeuniverse-*.apk
# (the dae binary itself must come from the firmware / the upstream dae apk).

on:
  workflow_dispatch:
    inputs:
      sdk_run_id:
        description: "Run ID of build-air6.yml to take the SDK from (blank = latest successful)"
        required: false
        type: string
      feed_ref:
        description: "daeuniverse/openwrt-packages ref (branch/tag/commit)"
        required: false
        type: string
        default: "main"

permissions:
  contents: read
  actions: read

concurrency:
  group: build-dae-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd build-essential flex bison gawk \
            gettext libncurses-dev libssl-dev python3 rsync unzip file wget \
            curl libelf-dev

      - name: Resolve SDK run ID
        id: runid
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RID="${{ inputs.sdk_run_id }}"
          if [ -z "$RID" ]; then
            RID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-air6.yml \
              --status success --limit 1 --json databaseId -q '.[0].databaseId')
          fi
          echo "Using SDK from run $RID"
          echo "rid=$RID" >> "$GITHUB_OUTPUT"

      - name: Download SDK artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p sdk
          gh run download "${{ steps.runid.outputs.rid }}" \
            --repo "$GITHUB_REPOSITORY" -n openwrt-air6-sdk --dir sdk
          ls -lh sdk/

      - name: Unpack SDK
        run: |
          SDK=$(find sdk -name 'openwrt-sdk-*.tar.zst' | sed -n '1p')
          [ -z "$SDK" ] && { echo "SDK tarball missing"; exit 1; }
          mkdir -p sdkroot
          tar --zstd -xf "$SDK" -C sdkroot --strip-components=1
          echo "SDK unpacked:"; ls sdkroot | head

      - name: Checkout dae OpenWrt feed
        uses: actions/checkout@v4
        with:
          repository: daeuniverse/openwrt-packages
          ref: ${{ inputs.feed_ref }}
          path: dae-feed

      - name: Configure feeds (SDK base/luci pins + dae feed as src-link)
        working-directory: sdkroot
        run: |
          # Use the SDK's own pinned base/luci feeds, plus the dae feed via
          # src-link pointing at the checked-out tree. This matches the upstream
          # feed's LuCI job exactly (see build-vmlinux-btf.yml).
          grep -E '^src-git (--root=package )?(base|luci) ' feeds.conf.default > feeds.conf
          printf 'src-link local %s\n' "$GITHUB_WORKSPACE/dae-feed" >> feeds.conf
          cat feeds.conf
          ./scripts/feeds update base luci local
          # luci.mk needs luci-base's host tools (po2lmo, jsmin) in the tree.
          ./scripts/feeds install -p luci luci-base
          ./scripts/feeds install -p local luci-lib-daeuniverse luci-app-dae \
            vmlinux-btf-builtin
          make defconfig

      - name: Build LuCI apks with the SDK
        working-directory: sdkroot
        run: |
          set -euo pipefail
          # Select the pure-Lua packages with =m; deselect dae (Go binary,
          # needs BTF blob + Go/clang + kmods, built elsewhere) and the real
          # vmlinux-btf (needs the kernel BTF blob). Command-line variables
          # win over .config. The empty vmlinux-btf-builtin satisfies dae's
          # BTF dependency on this ImmortalWrt kernel that has its own BTF.
          PKGS=(luci-lib-daeuniverse luci-app-dae vmlinux-btf-builtin)
          CFG=("${PKGS[@]/#/CONFIG_PACKAGE_}")
          make package/luci-lib-daeuniverse/compile \
            package/luci-app-dae/compile \
            package/vmlinux-btf-builtin/compile V=s \
            "${CFG[@]/%/=m}" \
            CONFIG_PACKAGE_dae= CONFIG_PACKAGE_vmlinux-btf= \
            2>&1 | tee build-dae.log

      - name: Collect + verify .apk
        if: always()
        working-directory: sdkroot
        run: |
          echo "### Build result" >> "$GITHUB_STEP_SUMMARY"
          if [ -f build-dae.log ]; then
            grep -iE 'error:' build-dae.log | sed -n '1,30p' >> "$GITHUB_STEP_SUMMARY" || true
          fi
          APKS=$(find bin/packages -path '*/local/*' -name '*.apk' -type f 2>/dev/null)
          echo "$APKS" | tee -a "$GITHUB_STEP_SUMMARY"
          for name in luci-app-dae luci-lib-daeuniverse; do
            if ! echo "$APKS" | grep -q "/${name}-"; then
              echo "ERROR: no ${name} apk produced"; exit 1
            fi
          done

      - name: Upload log on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-dae-log
          path: sdkroot/build-dae.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload LuCI apks
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: air6-luci-app-dae
          path: sdkroot/bin/packages/*/local/
          if-no-files-found: error
          retention-days: 14
